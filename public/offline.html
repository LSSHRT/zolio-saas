<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne — Zolio</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #15122b 0%, #0a0a0c 60%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(18px);
        padding: 40px 28px;
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #8b5cf6, #f43f5e);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 24px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        padding: 14px 28px;
        border-radius: 14px;
        background: linear-gradient(135deg, #8b5cf6, #f43f5e);
        box-shadow: 0 12px 30px -10px rgba(139, 92, 246, 0.5);
      }
      .hint { margin-top: 18px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Z</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Impossible de joindre Zolio pour le moment. Vérifiez votre connexion
        internet — vos données seront de nouveau accessibles dès le retour du réseau.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
      <div class="hint">Zolio · Devis &amp; Factures pour électriciens</div>
    </div>
  </body>
</html>
